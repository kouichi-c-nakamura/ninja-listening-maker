<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥷 Ninja Audio Maker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #eee;
      padding: 20px;
      max-width: 640px;
      margin: 0 auto;
      user-select: none;
    }
    h1 { font-size: 22px; color: #00d2ff; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    p.desc { font-size: 13px; color: #aaa; margin-top: 0; line-height: 1.5; }
    
    .dropzone {
      border: 2px dashed #444;
      border-radius: 8px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      background: #1a1a1a;
      transition: all 0.2s;
    }
    .dropzone:hover { border-color: #00d2ff; background: #222; }

    .trimmer-box {
      margin-top: 20px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 16px;
      display: none;
    }
    .trim-title { font-size: 13px; font-weight: bold; color: #ddd; margin-bottom: 12px; }
    
    #trim-canvas {
      width: 100%;
      height: 52px;
      border-radius: 6px;
      background: #181818;
      cursor: default;
      display: block;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-family: monospace;
      color: #aaa;
      margin-top: 10px;
    }

    .preview-btns {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .btn-secondary {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #eee;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-secondary:hover { background: #383838; }

    .btn-primary {
      background: #00d2ff;
      color: #121212;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
      margin-top: 18px;
    }
    .btn-primary:disabled { background: #333; color: #777; cursor: not-allowed; }

    #log {
      background: #0a0a0a;
      border: 1px solid #222;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      height: 140px;
      overflow-y: auto;
      margin-top: 16px;
      white-space: pre-wrap;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>🥷 Ninja Audio Maker</h1>
  <p class="desc">Repeats the selected clip at incrementally faster speeds [1.0x, 0.6x ×3, 0.7x...2.0x] with 0.8s silence gaps.</p>

  <div class="dropzone" id="dropzone">
    <span id="file-label">音声ファイルをドロップ または クリックして選択</span>
    <input type="file" id="file-input" accept="audio/*" style="display: none;">
  </div>

  <div class="trimmer-box" id="trimmer-box">
    <div class="trim-title">✂️ 練習区間のトリミング（左右ハンドルで範囲指定 / 試聴中は赤線が追従）</div>
    
    <canvas id="trim-canvas"></canvas>

    <div class="time-labels">
      <span>Start: <strong id="start-time-text" style="color:#00d2ff;">00:00.0</strong></span>
      <span>Duration: <strong id="duration-text">0.0s</strong></span>
      <span>End: <strong id="end-time-text" style="color:#ff00cc;">00:00.0</strong></span>
    </div>

    <div class="preview-btns">
      <button class="btn-secondary" id="preview-btn">▶ 選択区間を試聴 (1.0x)</button>
      <button class="btn-secondary" id="stop-btn">■ 停止</button>
    </div>
  </div>

  <button class="btn-primary" id="export-btn" disabled>Ninja 音声を生成して保存 (WAV)</button>
  <div id="log">ステータス: 音声ファイルを選択してください。</div>

  <script>
    const SPEED_SEQUENCE = [
      1.0, 0.6, 0.6, 0.6, 0.7, 0.8, 0.9, 1.0,
      1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8, 1.9, 2.0
    ];
    const SILENCE_GAP_SEC = 0.8;

    let audioCtx = null;
    let originalAudioBuffer = null;
    let selectedFileName = '';

    let startTime = 0;
    let endTime = 0;

    let previewSource = null;
    let previewStartTime = 0;
    let previewStartOffset = 0;
    let playheadAnimId = null;
    let currentPlayheadPos = -1;

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const fileLabel = document.getElementById('file-label');
    const trimmerBox = document.getElementById('trimmer-box');
    const canvas = document.getElementById('trim-canvas');
    const ctx = canvas.getContext('2d');
    const startTimeText = document.getElementById('start-time-text');
    const endTimeText = document.getElementById('end-time-text');
    const durationText = document.getElementById('duration-text');
    const previewBtn = document.getElementById('preview-btn');
    const stopBtn = document.getElementById('stop-btn');
    const exportBtn = document.getElementById('export-btn');
    const logBox = document.getElementById('log');

    function log(msg) {
      logBox.textContent += '\n' + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 10);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${ms}`;
    }

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files[0]) loadFile(e.target.files[0]);
    });
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = '#00d2ff'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = '#444'; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = '#444';
      if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });

    async function loadFile(file) {
      const lastDot = file.name.lastIndexOf('.');
      selectedFileName = lastDot !== -1 ? file.name.substring(0, lastDot) : file.name;

      fileLabel.textContent = `選択中: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
      logBox.textContent = '音声デコード中...';

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const arrayBuffer = await file.arrayBuffer();

      try {
        originalAudioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        const totalDuration = originalAudioBuffer.duration;

        startTime = 0;
        endTime = totalDuration;
        currentPlayheadPos = -1;

        trimmerBox.style.display = 'block';
        exportBtn.disabled = false;

        initCanvasSize();
        drawTrimmer();
        updateTimeLabels();

        log(`解析完了: 全長 ${formatTime(totalDuration)} / サンプルレート ${originalAudioBuffer.sampleRate}Hz`);
      } catch (err) {
        log('エラー: 音声ファイルのデコードに失敗しました。');
      }
    }

    function initCanvasSize() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = 52 * window.devicePixelRatio;
    }

    window.addEventListener('resize', () => {
      if (originalAudioBuffer) {
        initCanvasSize();
        drawTrimmer();
      }
    });

    let dragTarget = null;
    let dragStartX = 0;
    let initialStart = 0;
    let initialEnd = 0;

    function drawTrimmer() {
      if (!originalAudioBuffer) return;
      const w = canvas.width;
      const h = canvas.height;
      const total = originalAudioBuffer.duration;

      ctx.clearRect(0, 0, w, h);

      ctx.fillStyle = '#1c1c1c';
      ctx.fillRect(0, 0, w, h);

      const x1 = (startTime / total) * w;
      const x2 = (endTime / total) * w;

      ctx.fillStyle = 'rgba(0, 210, 255, 0.2)';
      ctx.fillRect(x1, 0, x2 - x1, h);

      ctx.fillStyle = '#00d2ff';
      ctx.fillRect(x1, 0, x2 - x1, 2 * window.devicePixelRatio);
      ctx.fillRect(x1, h - 2 * window.devicePixelRatio, x2 - x1, 2 * window.devicePixelRatio);

      ctx.fillStyle = '#00d2ff';
      ctx.fillRect(x1 - 4 * window.devicePixelRatio, 0, 8 * window.devicePixelRatio, h);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x1 - 1 * window.devicePixelRatio, h * 0.3, 2 * window.devicePixelRatio, h * 0.4);

      ctx.fillStyle = '#ff00cc';
      ctx.fillRect(x2 - 4 * window.devicePixelRatio, 0, 8 * window.devicePixelRatio, h);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x2 - 1 * window.devicePixelRatio, h * 0.3, 2 * window.devicePixelRatio, h * 0.4);

      if (currentPlayheadPos >= 0) {
        const px = (currentPlayheadPos / total) * w;
        ctx.fillStyle = '#ff3344';
        ctx.fillRect(px - 1.5 * window.devicePixelRatio, 0, 3 * window.devicePixelRatio, h);
      }
    }

    function updateTimeLabels() {
      startTimeText.textContent = formatTime(startTime);
      endTimeText.textContent = formatTime(endTime);
      durationText.textContent = `${(endTime - startTime).toFixed(1)}s`;
    }

    function getCanvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      return (clientX - rect.left) / rect.width;
    }

    function handleMouseDown(e) {
      if (!originalAudioBuffer) return;
      const pos = getCanvasPos(e);
      const total = originalAudioBuffer.duration;
      const currentX = pos * total;

      const threshold = (14 / canvas.getBoundingClientRect().width) * total;

      if (Math.abs(currentX - startTime) <= threshold) {
        dragTarget = 'start';
      } else if (Math.abs(currentX - endTime) <= threshold) {
        dragTarget = 'end';
      } else if (currentX > startTime && currentX < endTime) {
        dragTarget = 'bar';
        dragStartX = currentX;
        initialStart = startTime;
        initialEnd = endTime;
      }
    }

    function handleMouseMove(e) {
      if (!originalAudioBuffer) return;
      const pos = getCanvasPos(e);
      const total = originalAudioBuffer.duration;
      const currentX = Math.max(0, Math.min(total, pos * total));

      if (!dragTarget) {
        const threshold = (14 / canvas.getBoundingClientRect().width) * total;
        if (Math.abs(currentX - startTime) <= threshold || Math.abs(currentX - endTime) <= threshold) {
          canvas.style.cursor = 'ew-resize';
        } else if (currentX > startTime && currentX < endTime) {
          canvas.style.cursor = 'grab';
        } else {
          canvas.style.cursor = 'default';
        }
        return;
      }

      if (dragTarget === 'start') {
        startTime = Math.min(currentX, endTime - 0.2);
      } else if (dragTarget === 'end') {
        endTime = Math.max(currentX, startTime + 0.2);
      } else if (dragTarget === 'bar') {
        const delta = currentX - dragStartX;
        const len = initialEnd - initialStart;
        let newStart = initialStart + delta;
        let newEnd = initialEnd + delta;

        if (newStart < 0) {
          newStart = 0;
          newEnd = len;
        } else if (newEnd > total) {
          newEnd = total;
          newStart = total - len;
        }
        startTime = newStart;
        endTime = newEnd;
      }

      drawTrimmer();
      updateTimeLabels();
    }

    function handleMouseUp() {
      dragTarget = null;
    }

    canvas.addEventListener('mousedown', handleMouseDown);
    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('mouseup', handleMouseUp);
    canvas.addEventListener('touchstart', handleMouseDown);
    window.addEventListener('touchmove', handleMouseMove);
    window.addEventListener('touchend', handleMouseUp);

    previewBtn.addEventListener('click', () => {
      stopPreview();
      previewSource = audioCtx.createBufferSource();
      previewSource.buffer = originalAudioBuffer;
      previewSource.connect(audioCtx.destination);

      previewStartTime = audioCtx.currentTime;
      previewStartOffset = startTime;
      currentPlayheadPos = startTime;

      previewSource.start(0, startTime, endTime - startTime);
      previewSource.onended = () => stopPreview();

      function updatePlayhead() {
        const elapsed = audioCtx.currentTime - previewStartTime;
        currentPlayheadPos = previewStartOffset + elapsed;
        if (currentPlayheadPos >= endTime) {
          stopPreview();
          return;
        }
        drawTrimmer();
        playheadAnimId = requestAnimationFrame(updatePlayhead);
      }
      playheadAnimId = requestAnimationFrame(updatePlayhead);
    });

    stopBtn.addEventListener('click', stopPreview);

    function stopPreview() {
      if (previewSource) {
        try { previewSource.stop(); } catch(e){}
        previewSource = null;
      }
      if (playheadAnimId) {
        cancelAnimationFrame(playheadAnimId);
        playheadAnimId = null;
      }
      currentPlayheadPos = -1;
      drawTrimmer();
    }

    // ---------- 完全内蔵型 ピッチ保持 WSOLA タイムストレッチ エンジン ----------
    function stretchBuffer(inputBuffer, rate) {
      if (Math.abs(rate - 1.0) < 0.001) return inputBuffer;

      const numChannels = inputBuffer.numberOfChannels;
      const sampleRate = inputBuffer.sampleRate;
      const inLength = inputBuffer.length;

      // 人の声に最適化されたフレーム窓設定 (約 50ms)
      const windowSize = Math.floor(sampleRate * 0.050);
      const halfWindow = Math.floor(windowSize / 2);
      const seekRange = Math.floor(sampleRate * 0.018); // 位相整合探索幅
      const hopIn = halfWindow;
      const hopOut = Math.floor(halfWindow / rate);

      const estimatedOutLength = Math.ceil(inLength / rate) + windowSize;
      const outBuffer = audioCtx.createBuffer(numChannels, estimatedOutLength, sampleRate);

      // Hann 窓
      const windowFunc = new Float32Array(windowSize);
      for (let i = 0; i < windowSize; i++) {
        windowFunc[i] = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (windowSize - 1)));
      }

      for (let ch = 0; ch < numChannels; ch++) {
        const input = inputBuffer.getChannelData(ch);
        const output = outBuffer.getChannelData(ch);
        const norm = new Float32Array(estimatedOutLength);

        let inPos = 0;
        let outPos = 0;

        while (inPos + windowSize + seekRange < inLength && outPos + windowSize < estimatedOutLength) {
          // 最適な重ね合わせポイント（相互相関最大点）を探索して位相をロック
          let bestOffset = 0;
          let maxCorr = -Infinity;

          for (let offset = -seekRange; offset <= seekRange; offset += 2) {
            const p = inPos + offset;
            if (p < 0 || p + halfWindow >= inLength) continue;

            let corr = 0;
            for (let i = 0; i < halfWindow; i += 4) {
              corr += input[inPos + i] * input[p + i];
            }
            if (corr > maxCorr) {
              maxCorr = corr;
              bestOffset = offset;
            }
          }

          const readPos = inPos + bestOffset;

          // 窓関数をかけて足し合わせる
          for (let i = 0; i < windowSize; i++) {
            const w = windowFunc[i];
            output[outPos + i] += input[readPos + i] * w;
            norm[outPos + i] += w;
          }

          inPos += hopIn;
          outPos += hopOut;
        }

        // 重なり度合いによる正規化（音割れ・振幅揺れを解消）
        for (let i = 0; i < estimatedOutLength; i++) {
          if (norm[i] > 1e-4) {
            output[i] /= norm[i];
          }
          // クリッピング防止リミッター
          output[i] = Math.max(-0.99, Math.min(0.99, output[i]));
        }
      }

      return outBuffer;
    }

    // WAV エンコーダー
    function bufferToWaveBlob(abuffer) {
      const numOfChan = abuffer.numberOfChannels;
      const length = abuffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let offset = 0;
      let pos = 0;

      function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
      function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

      setUint32(0x46464952); // "RIFF"
      setUint32(length - 8);
      setUint32(0x45564157); // "WAVE"
      setUint32(0x20746d66); // "fmt "
      setUint32(16);
      setUint16(1);
      setUint16(numOfChan);
      setUint32(abuffer.sampleRate);
      setUint32(abuffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      setUint32(0x61746164); // "data"
      setUint32(length - pos - 4);

      const channels = [];
      for (let i = 0; i < numOfChan; i++) {
        channels.push(abuffer.getChannelData(i));
      }

      while (pos < length) {
        for (let i = 0; i < numOfChan; i++) {
          let s = Math.max(-1, Math.min(1, channels[i][offset]));
          out.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
          pos += 2;
        }
        offset++;
      }
      return new Blob([out.buffer], { type: 'audio/wav' });
    }

    exportBtn.addEventListener('click', async () => {
      stopPreview();
      exportBtn.disabled = true;

      try {
        log(`トリミング範囲: ${formatTime(startTime)} 〜 ${formatTime(endTime)} (${(endTime - startTime).toFixed(1)}s)`);

        const sampleRate = originalAudioBuffer.sampleRate;
        const numChannels = originalAudioBuffer.numberOfChannels;

        const startSample = Math.floor(startTime * sampleRate);
        const endSample = Math.floor(endTime * sampleRate);
        const snippetLength = endSample - startSample;

        // 1. 指定区間を抽出
        const snippet = audioCtx.createBuffer(numChannels, snippetLength, sampleRate);
        for (let ch = 0; ch < numChannels; ch++) {
          snippet.copyToChannel(originalAudioBuffer.getChannelData(ch).subarray(startSample, endSample), ch);
        }

        // 2. 内蔵 WSOLA によるタイムストレッチ
        const parts = [];
        let totalSamples = 0;
        const gapSamples = Math.floor(sampleRate * SILENCE_GAP_SEC);

        for (let i = 0; i < SPEED_SEQUENCE.length; i++) {
          const speed = SPEED_SEQUENCE[i];
          log(`[${i + 1}/${SPEED_SEQUENCE.length}] ${speed.toFixed(1)}x 変換中...`);
          await new Promise(r => setTimeout(r, 10));

          const stretched = stretchBuffer(snippet, speed);
          parts.push(stretched);
          totalSamples += stretched.length;

          if (i < SPEED_SEQUENCE.length - 1) {
            totalSamples += gapSamples;
          }
        }

        // 3. 結合
        log('全パートを結合中...');
        const combinedBuffer = audioCtx.createBuffer(numChannels, totalSamples, sampleRate);

        let currentOffset = 0;
        for (let i = 0; i < parts.length; i++) {
          const p = parts[i];
          for (let ch = 0; ch < numChannels; ch++) {
            combinedBuffer.getChannelData(ch).set(p.getChannelData(ch), currentOffset);
          }
          currentOffset += p.length;

          if (i < parts.length - 1) {
            currentOffset += gapSamples;
          }
        }

        log('WAV ファイルを生成中...');
        const wavBlob = bufferToWaveBlob(combinedBuffer);

        log('完了！ダウンロードを開始します。');
        const url = URL.createObjectURL(wavBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${selectedFileName}_ninja_${formatTime(startTime).replace(':', 'm')}-${formatTime(endTime).replace(':', 'm')}.wav`;
        a.click();
        URL.revokeObjectURL(url);

      } catch (err) {
        log('エラーが発生しました: ' + err.message);
      } finally {
        exportBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
